[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sysdeck"
version = "1.0.0"
description = "A sci-fi system dashboard for your terminal"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["psutil>=5.9", "rich>=13"]

[project.scripts]
sysdeck = "sysdeck:main"

[tool.setuptools]
py-modules = ["sysdeck"]
